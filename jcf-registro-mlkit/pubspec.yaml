name: jcf_registro
version: 0.1.0+1
publish_to: none
description: Registro offline de familias beneficiadas por Fundación JCF con Google ML Kit.

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
