name: Publicar JCF Registro

on:
  push:
    branches: [main, codex/jcf-registro-v1-beta]
    paths: ['jcf-registro/**', '.github/workflows/jcf-registro-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jcf-registro-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jcf-registro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jcf-registro/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './jcf-registro/dist'
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
