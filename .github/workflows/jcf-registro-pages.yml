name: Publicar JCF Registro

on:
  push:
    branches: [main]
    paths:
      - 'jcf-registro/**'
      - '.github/workflows/jcf-registro-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: './jcf-registro'
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
