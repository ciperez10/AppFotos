name: Validar JCF Registro Web

on:
  pull_request:
    branches: [main]
    paths: ['jcf-registro/**', '.github/workflows/check-jcf-web.yml']

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jcf-registro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jcf-registro/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
