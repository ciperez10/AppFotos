name: Construir JCF Registro ML Kit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['jcf-registro-mlkit/**', '.github/workflows/build-jcf-mlkit.yml']
  pull_request:
    branches: [main]
    paths: ['jcf-registro-mlkit/**', '.github/workflows/build-jcf-mlkit.yml']

permissions:
  contents: read

jobs:
  android:
    name: APK Android y código iOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear proyecto móvil
        shell: bash
        run: |
          rm -rf build/jcf_registro
          mkdir -p build/jcf_registro
          cd build/jcf_registro
          flutter create --platforms=android,ios --org org.fundacionjcf --project-name jcf_registro .
          cp "$GITHUB_WORKSPACE/jcf-registro-mlkit/pubspec.yaml" pubspec.yaml
          cp "$GITHUB_WORKSPACE/jcf-registro-mlkit/analysis_options.yaml" analysis_options.yaml
          cp "$GITHUB_WORKSPACE/jcf-registro-mlkit/lib/main.dart" lib/main.dart
          rm -rf test

      - name: Configurar permisos y plataformas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('build/jcf_registro')
          gradle = root / 'android/app/build.gradle.kts'
          text = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(text)

          manifest = root / 'android/app/src/main/AndroidManifest.xml'
          manifest.write_text(manifest.read_text().replace('android:label="jcf_registro"', 'android:label="JCF Registro"'))

          plist = root / 'ios/Runner/Info.plist'
          tree = ET.parse(plist)
          dictionary = tree.getroot().find('dict')
          def set_string(key, value):
              items = list(dictionary)
              for i, item in enumerate(items):
                  if item.tag == 'key' and item.text == key:
                      items[i + 1].text = value
                      return
              ET.SubElement(dictionary, 'key').text = key
              ET.SubElement(dictionary, 'string').text = value
          set_string('CFBundleDisplayName', 'JCF Registro')
          set_string('NSCameraUsageDescription', 'JCF Registro usa la cámara para leer la cédula. La foto no se almacena.')
          set_string('NSPhotoLibraryUsageDescription', 'JCF Registro permite seleccionar una foto de cédula para leer sus datos. La foto no se almacena.')
          tree.write(plist, encoding='utf-8', xml_declaration=True)

          project = root / 'ios/Runner.xcodeproj/project.pbxproj'
          project.write_text(re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.5;', project.read_text()))
          PY

      - name: Descargar dependencias
        working-directory: build/jcf_registro
        run: flutter pub get

      - name: Revisar código
        working-directory: build/jcf_registro
        run: flutter analyze

      - name: Crear APK offline
        working-directory: build/jcf_registro
        run: flutter build apk --release

      - name: Preparar entregables
        shell: bash
        run: |
          cp build/jcf_registro/build/app/outputs/flutter-apk/app-release.apk build/JCF-Registro-MLKit.apk
          rm -rf build/jcf_registro/.dart_tool build/jcf_registro/build
          cd build && zip -qr jcf-registro-mlkit-source.zip jcf_registro

      - uses: actions/upload-artifact@v4
        with:
          name: JCF-Registro-MLKit-Android
          path: build/JCF-Registro-MLKit.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: JCF-Registro-MLKit-Codigo
          path: build/jcf-registro-mlkit-source.zip
          if-no-files-found: error
